<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CVS Garage helps college teams turn campus ideas into projects, events, mentorship, shared knowledge, and recognised contributions."
    />
    <meta property="og:title" content="CVS Garage — Build what campus needs" />
    <meta
      property="og:description"
      content="One shared campus workspace for projects, events, ideas, mentors, recognition, and practical conversations."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/garage-mark.svg" />
    <title>CVS Garage</title>
    <script>
      (() => {
        let saved = 'system';
        try {
          saved = localStorage.getItem('cvs-garage-theme') || 'system';
        } catch {
          // Storage can be unavailable in locked-down browser contexts.
        }
        const dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
