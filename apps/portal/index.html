<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CVS Garage college innovation portal for projects, events, ideas, members, rankings, and discussions."
    />
    <meta name="theme-color" content="#0f6cbd" />
    <title>CVS Garage</title>
    <script>
      (() => {
        let saved = 'system';
        try {
          saved = localStorage.getItem('cvs-garage-theme') || 'system';
        } catch {
          // Storage can be unavailable in locked-down browser contexts.
        }
        const dark = saved === 'dark' || (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
